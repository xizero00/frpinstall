#!/usr/bin/env bash
# ============================================================
#  frpinstall 安装配置
#
#  这里只放“与 frp 配置内容无关”的安装设置。
#
#  frp 的实际配置全部在 frp_template.toml 中：
#    - [common] 段：frpc/frps 重叠的公共参数（端口、token）
#    - [frpc]  段：FRP 客户端配置
#    - [frps]  段：FRP 服务端配置
# ============================================================

# ------------------------------------------------------------
# GitHub 下载代理（自动选择最快代理）
# ------------------------------------------------------------

# 是否自动从 Mirror 检测站 (https://demo.kentxxq.com/app/mirror)
# 的数据中，选择“最近检测通过、平均速度最快”的 GitHub 下载代理。
# 可选值：true / false
AUTO_SELECT_MIRROR=true

# Mirror 检测站页面所使用的后端数据接口（一般无需修改）
MIRROR_API_URL='https://uni.kentxxq.com/uni.webapi/githubMirror/GetMirrorStatus'

# 使用最近几天的检测数据（1 / 3 / 7 / 30）
MIRROR_API_DAYS='3'

# 备用代理域名：
#   - 自动选择失败，或 AUTO_SELECT_MIRROR=false 时使用；
#   - 只填域名，例如 ghfast.top；
#   - 留空表示直连 github.com（国内网络可能下载失败）。
FALLBACK_MIRROR='ghfast.top'

# ------------------------------------------------------------
# FRP 版本（自动检测官方最新版本）
# ------------------------------------------------------------

# 是否自动查询 fatedier/frp 官方最新 Release，下载最新版本。
# 可选值：true / false
AUTO_DETECT_LATEST_VERSION=true

# 手动指定的 FRP 版本号（自动检测关闭或查询失败时使用），例如 0.71.0
FRP_VERSION='0.71.0'

# 下载平台架构：linux_amd64 / linux_arm64 / linux_arm / darwin_amd64 等
FRP_ARCH='linux_amd64'

# ------------------------------------------------------------
# 安装相关设置
# ------------------------------------------------------------

# 用于区分服务与配置文件归属的用户名（默认取当前登录用户名）
USER_NAME=${USER}

# 服务类型：systemd（推荐，已测试）或 initd（未测试）
SERVICETYPE='systemd'

# ------------------------------------------------------------
# frp 配置模板路径（一般无需修改）
#
#   安装时脚本读取 frp_template.toml，替换 [common] 中的公共参数后，
#   提取 [frpc] / [frps] 两段，分别生成：
#     /etc/frp/frpc_${USER_NAME}.toml
#     /etc/frp/frps_${USER_NAME}.toml
# ------------------------------------------------------------
