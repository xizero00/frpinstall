#!/usr/bin/env bash
# ============================================================
#  frpinstall 配置文件
#
#  修改本文件后，直接重新运行 ./frpinstall.sh 即可生效。
#  变量含义可参考 README.md。
# ============================================================

# ------------------------------------------------------------
# GitHub 下载代理（自动选择最快代理）
# ------------------------------------------------------------

# 是否自动从 Mirror 检测站 (https://demo.kentxxq.com/app/mirror)
# 的数据中，选择“最近检测通过、平均速度最快”的 GitHub 下载代理。
# 可选值：true / false
AUTO_SELECT_MIRROR=true

# Mirror 检测站页面所使用的后端数据接口（一般无需修改）
MIRROR_API_URL='https://uni.kentxxq.com/uni.webapi/githubMirror/GetMirrorStatus'

# 使用最近几天的检测数据（1 / 3 / 7 / 30）
MIRROR_API_DAYS='3'

# 备用代理域名：
#   - 自动选择失败，或 AUTO_SELECT_MIRROR=false 时使用；
#   - 只填域名，例如 ghfast.top；
#   - 留空表示直连 github.com（国内网络可能下载失败）。
FALLBACK_MIRROR='ghfast.top'

# ------------------------------------------------------------
# FRP 版本（自动检测官方最新版本）
# ------------------------------------------------------------

# 是否自动查询 fatedier/frp 官方最新 Release，下载最新版本。
# 可选值：true / false
AUTO_DETECT_LATEST_VERSION=true

# 手动指定的 FRP 版本号（自动检测关闭或查询失败时使用），例如 0.71.0
FRP_VERSION='0.71.0'

# 下载平台架构：linux_amd64 / linux_arm64 / linux_arm / darwin_amd64 等
FRP_ARCH='linux_amd64'

# ------------------------------------------------------------
# FRP 连接相关配置
# ------------------------------------------------------------

# 公网主机（FRP 服务端所在机器）的 IP 地址
FRP_SERVER_IP='127.0.0.1'

# 公网主机用于 FRP 服务连接的端口
FRP_SERVER_PORT='7000'

# 公网主机对外提供服务使用的端口
# 例如希望内网 ssh 在外网以 10022 端口访问，则填 10022
FRP_INET_PORT='10022'

# 反向代理的服务名称（仅用于标识，不要带空格）
SERVICE_NAME='ssh'

# 内网主机上实际服务的端口（例如 ssh 为 22）
LOCAL_SERVICE_PORT='22'

# FRP 服务端与客户端之间的连接校验密码
FRP_TOKEN='123456@!(xixihaha)'

# 用于区分服务归属的用户名（默认取当前登录用户名）
USER_NAME=${USER}

# ------------------------------------------------------------
# FRP 服务端自带 Web 面板（仅安装 frps 服务端时使用）
# ------------------------------------------------------------
FRP_WEB_SERVER_PORT='7500'
FRP_WEB_SERVER_USER='admin'
FRP_WEB_SERVER_PASSWORD='adminxdaas@d@xxx'

# ------------------------------------------------------------
# 服务类型
# systemd：推荐（已测试）；initd：未测试
# ------------------------------------------------------------
SERVICETYPE='systemd'
