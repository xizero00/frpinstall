# ============================================================
# frpc（FRP 客户端）配置模板
#
# 安装 frpc 时，脚本会替换本文件中的 ${...} 占位符，并安装为：
#   /etc/frp/frpc_${USER_NAME}.toml
#
# 公共占位符（来自 frp.conf，一般不要直接改这里）：
#   ${FRP_SERVER_PORT}  -> serverPort
#   ${FRP_TOKEN}        -> auth.token
#
# 其余内容请按实际环境修改，例如：
#   - serverAddr：改成你的公网服务器 IP / 域名
#   - [[proxies]]：需要映射到公网的服务，可写多个
#
# 参考文档：
#   https://github.com/fatedier/frp/blob/dev/README.md#example-usage
# ============================================================

serverAddr = "127.0.0.1"
serverPort = ${FRP_SERVER_PORT}

auth.method = "token"
auth.token = "${FRP_TOKEN}"

# 示例：把内网 ssh（127.0.0.1:22）映射到公网 10022 端口
[[proxies]]
name = "ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 10022

# 需要映射更多服务时，复制并修改下面的示例即可，例如把内网 8080
# 端口的 Web 服务映射到公网 80 端口：
#
# [[proxies]]
# name = "web"
# type = "tcp"
# localIP = "127.0.0.1"
# localPort = 8080
# remotePort = 80

# 也可以使用 udp / http / https 等其他类型，按官方文档填写即可。
