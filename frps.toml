# ============================================================
# frps（FRP 服务端）完整配置
#
# 安装 frps 时，脚本会把本文件安装为：
#   /etc/frp/frps_${USER_NAME}.toml
#
# 这里的内容就是 frp 服务端配置本身，请按实际环境修改：
#   - bindPort：frpc 客户端连接的端口
#   - auth.token：与客户端 frpc.toml 保持一致
#   - webServer.*：frps 自带 Web 面板（按需修改）
#
# 参考文档：
#   https://github.com/fatedier/frp/blob/dev/README.md#example-usage
# ============================================================

bindPort = 7000

auth.method = "token"
auth.token = "123456@!(xixihaha)"

webServer.addr = "127.0.0.1"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "adminxdaas@d@xxx"
