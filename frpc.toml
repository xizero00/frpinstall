# ============================================================
# frpc（FRP 客户端）完整配置
#
# 安装 frpc 时，脚本会把本文件安装为：
#   /etc/frp/frpc_${USER_NAME}.toml
#
# 这里的内容就是 frp 客户端配置本身，请按实际环境修改：
#   - serverAddr：改成你的公网服务器 IP / 域名
#   - auth.token：与服务端 frps.toml 保持一致
#   - [[proxies]]：需要映射到公网的服务，可写多个
#
# 参考文档：
#   https://github.com/fatedier/frp/blob/dev/README.md#example-usage
# ============================================================

serverAddr = "127.0.0.1"
serverPort = 7000

auth.method = "token"
auth.token = "123456@!(xixihaha)"

# 示例：把内网 ssh（127.0.0.1:22）映射到公网 10022 端口
[[proxies]]
name = "ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 10022

# 需要映射更多服务时，复制并修改下面的示例即可，例如把内网 8080
# 端口的 Web 服务映射到公网 80 端口：
#
# [[proxies]]
# name = "web"
# type = "tcp"
# localIP = "127.0.0.1"
# localPort = 8080
# remotePort = 80

# 也可以使用 udp / http / https 等其他类型，按官方文档填写即可。
